apiVersion: v1
kind: Service
metadata:
  name: vpn-service
  namespace: vpn
  labels:
    app: vpn-service
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: wireguard
    port: 51820
    targetPort: 51820
    protocol: UDP
  selector:
    app: vpn-service
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: vpn
spec:
  type: ClusterIP
  ports:
  - port: 5432
  selector:
    app: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: vpn
spec:
  type: ClusterIP
  ports:
  - port: 6379
  selector:
    app: redis
