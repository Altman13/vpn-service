version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vpn-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vpn_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../scripts/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vpn-network

  redis:
    image: redis:7-alpine
    container_name: vpn-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vpn-network

  app:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    container_name: vpn-service
    ports:
      - "8080:8080"
      - "51820:51820/udp"
    environment:
      DATABASE_HOST: postgres
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
    volumes:
      - ../../configs:/app/configs
      - /var/run/wireguard:/var/run/wireguard
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vpn-network

networks:
  vpn-network:
    driver: bridge

volumes:
  postgres_data: